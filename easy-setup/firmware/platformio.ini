; easy-setup 版ファームウェア。WiFi 設定は secrets.h ではなく NVS に保存し、
; USB シリアル経由で setup.py から書き込む(ビルドに個人情報が入らないので配布可能)
[env:m5stack-atom]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
lib_deps = fastled/FastLED@3.7.8   ; 3.10.x は espressif32@6.9.0 で専用ドライバが使えず LED が更新されない
